[project]
name = "quadrium"
version = "0.1.0"
description = "Research-first FX/XAUUSD trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "duckdb>=0.10.0",
    "pandas>=2.2.1",
    "pyarrow>=15.0.1",
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.2.1",
    "torch>=2.2.1",
    "mlflow>=2.11.1",
    "hydra-core>=1.3.2",
    "optuna>=3.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.2",
    "mypy>=1.9.0"
]
mt5 = [
    "MetaTrader5>=5.0.45; sys_platform == 'win32'"
]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
exclude = ["backend/tests"]
