[project]
name = "quadrium-backend"
version = "0.1.0"
description = "Quadrium — Local-first AI/ML trading research platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "anisansarix" },
]

dependencies = [
    # === Web Framework ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # === Database ===
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.21.0",
    "duckdb>=1.1.0",
    "alembic>=1.14.0",

    # === Data Processing ===
    "polars>=1.15.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=18.0.0",

    # === ML / FinRL ===
    # PyTorch must be installed separately with CUDA support:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu121
    "stable-baselines3>=2.4.0",
    "gymnasium>=1.0.0",

    # === Technical Analysis ===
    # TA-Lib requires C library installed separately on Windows
    # "ta-lib>=0.4.32",
    "pandas-ta>=0.3.14b1",

    # === MT5 ===
    # Windows-only: pip install MetaTrader5
    # "MetaTrader5>=5.0.45",

    # === Experiment Tracking ===
    "mlflow>=2.19.0",

    # === Logging ===
    "structlog>=24.4.0",

    # === Configuration ===
    "tomli>=2.2.0; python_version < '3.11'",

    # === Templating ===
    "jinja2>=3.1.0",

    # === Utilities ===
    "httpx>=0.28.0",
    "websockets>=14.0",
    "psutil>=6.1.0",
    "yfinance>=0.2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

mt5 = [
    "MetaTrader5>=5.0.45",
]

finrl = [
    "finrl>=0.3.6",
]

gpu = [
    # Install separately:
    # pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    "optuna>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
